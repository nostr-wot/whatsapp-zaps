<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fe076"/>
      <stop offset="1" stop-color="#00a884"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ffa600"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#005c4b" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#tile)"/>
  <!-- speech bubble, tail at the lower left -->
  <path filter="url(#soft)" fill="#ffffff"
